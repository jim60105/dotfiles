modelRoles:
  default: openrouter/deepseek/deepseek-v4-flash-0731
  smol: openrouter/deepseek/deepseek-v4-flash-0731

  # Rubber Duck 使用獨立 role，
  # 之後更換 reviewer model 不必修改 agent 定義。
  rubber_duck: openai/gpt-5.6-terra

shellPath: /bin/zsh

# 建議啟用 OMP 原生 Bash → dedicated tool routing。
# cat/grep/find 等操作會優先要求模型使用 read/grep/glob。
bashInterceptor:
  enabled: true
